name: Summoner 2 (USA)
# sha1 of iso/SLUS_204.48.rom (the ELF's loadable segment, via objcopy -O binary)
sha1: 678c865a3f17fa34c7c0c775fd9c3c03f8f352c7
options:
  basename: SLUS_204.48
  target_path: iso/SLUS_204.48.rom
  elf_path: build/SLUS_204.48.elf
  base_path: ..
  platform: ps2
  compiler: MWCCPS2

  gp_value: 0x002DBCF0

  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/SLUS_204.48.ld
  ld_dependencies: False
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: True
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
  undefined_funcs_auto_path: config/undefined_funcs_auto.txt
  undefined_syms_auto_path: config/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order:
    - .text
    - .data
    - .rodata
    - .init
    - .ctor
    - .sdata
    - .sbss
    - .bss

segments:
  - name: main
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0x160C100
    subalign: null
    subsegments:
      # ---- .text 0x00100000: game code (MWCC C++) + Sony SDK 2.4 libraries ----
      - [0x000000, asm, text_00100000]
      - [0x097D30, asm, console]
      - [0x099450, asm, debug]
      - [0x099580, asm, frametime]
      - [0x0998B0, asm, memory]
      - [0x099BB0, asm, norlsallocpool]
      - [0x099EE0, asm, plainstring]
      - [0x09A450, asm, platform_ngps]
      - [0x09AA80, asm, stringpool]
      - [0x09ACF0, asm, timer]
      - [0x09B010, asm, timestamp]
      - [0x09B490, asm, text_0019B490]
      # ---- 0x002A3380 VU1 microcode ----
      - [0x1A3380, bin, vutext]
      # ---- 0x002A8300 .data (also holds libkernel's kseg0 patch code at 0x2ABA80) ----
      - [0x1A8300, data, data_002A8300]
      - [0x1A9B80, data, platform_ngps]
      - [0x1A9B90, data, data_002A9B90]
      # ---- 0x002B3100 .rodata (start is a guess from the first jump table) ----
      - { start: 0x1B3100, type: rodata, name: rodata_002B3100, linker_section_order: .data }
      - { start: 0x1B96F0, type: rodata, name: console, linker_section_order: .data }
      - { start: 0x1B9AF0, type: rodata, name: debug, linker_section_order: .data }
      - { start: 0x1B9B10, type: rodata, name: memory, linker_section_order: .data }
      - { start: 0x1B9BE8, type: rodata, name: plainstring, linker_section_order: .data }
      - { start: 0x1B9C10, type: rodata, name: platform_ngps, linker_section_order: .data }
      - { start: 0x1B9CC8, type: rodata, name: stringpool, linker_section_order: .data }
      - { start: 0x1B9D00, type: rodata, name: timer, linker_section_order: .data }
      - { start: 0x1B9D40, type: rodata, name: rodata_002B9D40, linker_section_order: .data }
      # ---- 0x002CF680 C++ static initializers (__sinit_*) ----
      - { start: 0x1CF680, type: asm, name: sinit, linker_section_order: .data }
      # ---- 0x002D39D0 static initializer table (135 entries), then misc data ----
      - [0x1D39D0, data, ctors]
      # ---- 0x002D3D00 .sdata (_gp = 0x2D3D00 + 0x7FF0) ----
      - { start: 0x1D3D00, type: sdata, name: sdata_002D3D00, linker_section_order: .data }
      - { start: 0x1D3F34, type: sdata, name: console, linker_section_order: .data }
      - { start: 0x1D3F3C, type: sdata, name: frametime, linker_section_order: .data }
      - { start: 0x1D3F58, type: sdata, name: memory, linker_section_order: .data }
      - { start: 0x1D3F60, type: sdata, name: timestamp, linker_section_order: .data }
      - { start: 0x1D3F68, type: sdata, name: sdata_002D3F68, linker_section_order: .data }
      # ---- 0x002D4200 .sbss/.bss (includes a large static heap) up to _end = 0x018E0300 ----
      - { start: 0x1D4200, type: bss, vram: 0x002D4200, name: bss_002D4200 }
      - { start: 0x1D4200, type: sbss, vram: 0x002D4838, name: console, linker_section_order: .bss }
      - { start: 0x1D4200, type: sbss, vram: 0x002D4868, name: frametime, linker_section_order: .bss }
      - { start: 0x1D4200, type: sbss, vram: 0x002D488C, name: memory, linker_section_order: .bss }
      - { start: 0x1D4200, type: sbss, vram: 0x002D48BC, name: timer, linker_section_order: .bss }
      - { start: 0x1D4200, type: sbss, vram: 0x002D48C8, name: timestamp, linker_section_order: .bss }
      - { start: 0x1D4200, type: bss, vram: 0x002D48CC, name: bss_002D48CC }
      - { start: 0x1D4200, type: bss, vram: 0x007C2F80, name: memory }
      - { start: 0x1D4200, type: bss, vram: 0x00809F80, name: bss_00809F80 }
      - { start: 0x1D4200, type: bss, vram: 0x00925690, name: console }
      - { start: 0x1D4200, type: bss, vram: 0x00926340, name: frametime }
      - { start: 0x1D4200, type: bss, vram: 0x00926380, name: bss_00926380 }
  - [0x1D4200]
