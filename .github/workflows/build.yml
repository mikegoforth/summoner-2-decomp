name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # URL of the original SLUS_204.48, stored as a repository secret because the
      # executable can't be committed. Secrets aren't passed to pull requests from forks, so
      # those runs stop after installing dependencies.
      ELF_URL: ${{ secrets.ELF_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch the original executable
        if: env.ELF_URL != ''
        run: |
          curl -fsSL "$ELF_URL" -o iso/SLUS_204.48
          echo "a5e367fabef46215a66eebd281dfe42e0afac91c  iso/SLUS_204.48" | sha1sum -c -

      - name: Configure
        if: env.ELF_URL != ''
        run: python configure.py

      - name: Build and verify
        if: env.ELF_URL != ''
        run: ninja

      - name: Progress report
        if: env.ELF_URL != ''
        run: |
          ninja report
          python tools/progress.py build/report.json

      # decomp.dev reads this artifact from push runs on the default branch.
      - name: Upload report
        if: env.ELF_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_204.48_report
          path: build/report.json

      # Until CI can build, publish the report committed in progress/report.json
      # (regenerate it with `ninja report` and copy build/report.json over it).
      - name: Upload committed report
        if: env.ELF_URL == ''
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_204.48_report
          path: progress/report.json
